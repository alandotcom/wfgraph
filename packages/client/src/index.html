<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The StyleX dev stylesheet is injected at the end of this head. Declare
         its priority layers first so consumer xstyle rules outrank Astryx
         component defaults in both development and production. -->
    <style>
      @layer reset, theme, base, astryx-base, astryx-theme, components, utilities, priority1, priority2, priority3, priority4;
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <base href="/" />
    <title>Workflow Graph</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
