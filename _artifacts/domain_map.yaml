# Domain map for Workflow Graph adopter skills.
library:
  name: wfgraph
  version: "3.1.1"
  repository: https://github.com/alandotcom/wfgraph
  description: Self-hosted workflow engine a host embeds; Events, actions, and integrations are values the host passes in.

coverage:
  ignored_packages:
    - name: "@wfgraph/client"
      reason: The editor is clientBundle passed to createWfGraphApp; embedding lives in @wfgraph/core skills.

domains:
  embed:
    summary: Mount createWfGraphApp, auth, encryption, Inngest, client bundle, logging.
    sources:
      - alandotcom/wfgraph:README.md
      - alandotcom/wfgraph:docs/embedding.md
    failure_modes:
      - Omitting auth leaves the editor reachable with decrypted credentials.
      - Mounting a body parser before createRequestListener breaks Inngest signature verification.
      - Passing client in development (Vite serves the SPA; client is the production bundle).
  events:
    summary: defineEvent identity, schema, correlationPath, umbrella source, intake.
    sources:
      - alandotcom/wfgraph:docs/events.md
    failure_modes:
      - One umbrella Event with a subtype field instead of two Event names.
      - Transforming the payload at intake so Wait matches see a rewritten Date.
  host_actions:
    summary: defineAction Promise handlers beside integration Effect handlers.
    sources:
      - alandotcom/wfgraph:docs/embedding.md
      - alandotcom/wfgraph:docs/integrations.md
    failure_modes:
      - Writing an Effect handler on defineAction (host stays Promise-first).
      - Catching readCredentials and swallowing a store failure.
  persistence:
    summary: wfPostgres, wfSqlite, wfWorker/wfHyperdrive, migrateWfGraphDatabase.
    sources:
      - alandotcom/wfgraph:docs/embedding.md
    failure_modes:
      - Mixing url and separate postgres fields.
      - Putting search_path on the postgres URL.
      - Applying shipped SQL with psql into public instead of @wfgraph/core/migrate.
      - Hyperdrive with query caching enabled.
  integrations:
    summary: defineIntegration, callExternal, OAuth adapters, testing, evolve/retire.
    sources:
      - alandotcom/wfgraph:docs/integrations.md
    failure_modes:
      - Registering on import instead of passing the value to extensions.integrations.
      - Lifting an action or handler into a const and losing contextual types.
      - Calling a vendor SDK instead of callExternal when the SDK owns only HTTP.
      - Retrying OAuth token writes; Core serializes refresh.
      - Removing a config key under the same action id.
  plugins:
    summary: builtInIntegrations, Slack factory, Resend metadata OAuth, plugins/ui.
    sources:
      - alandotcom/wfgraph:docs/embedding.md
      - alandotcom/wfgraph:packages/plugins/README.md
    failure_modes:
      - Expecting import of @wfgraph/plugins to turn integrations on.
      - Two copies of @wfgraph/core (peer must resolve to one).
      - Slack OAuth without publicUrl or with header-based auth on the callback.
