  - from: wfgraph-core
    to: observability
    reason: Start-up warns when no logging is configured; wfgraph-core keeps the one-line console setup and observability owns the rest of logging and tracing.
  - from: wfgraph-core
    to: cloudflare-worker
    reason: The Worker bullets and failure modes in wfgraph-core move to the planned cloudflare-worker skill.

