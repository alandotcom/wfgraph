tensions:
  - name: Promise host step versus Effect integration
    skills: [host-actions, integrations]
    description: The two authoring paths share step.run, schemas and sideEffect, and differ in handler style, credential reads and failure signalling.
    implication: An agent that loads one skill writes the other path's handler, credential read or failure form.
  - name: In-process loop versus a separate runner or a Worker
    skills: [wfgraph-core, cloudflare-worker]
    description: createWfGraphApp runs the worker loop by default, while a Worker runs ticks and createWfGraphRunner refuses SQLite and Hyperdrive.
    implication: An agent applies runner options to a Worker, or turns the loop off in every process.
  - name: OAuth callback behind host auth
    skills: [wfgraph-plugins, wfgraph-core, auth]
    description: The built-in OAuth flows need publicUrl and an auth callback that accepts a top-level provider redirect.
    implication: An agent writes header-only authentication and every OAuth connection fails at the callback.

cross_references:
  - from: events
    to: wfgraph-core
    reason: The worker loop delivers every Event, and events.retentionMs is both the inbox retention window and the deduplication window.
  - from: host-actions
    to: integrations
    reason: The Promise and Effect comparison decides which path a step belongs on.
  - from: integrations
    to: wfgraph-plugins
    reason: The six built-ins are the worked examples, and a host turns them on the same way it turns on its own integration.
  - from: wfgraph-plugins
    to: wfgraph-core
    reason: OAuth and webhook URLs depend on publicUrl, basePath and the auth callback.
  - from: wfgraph-core
