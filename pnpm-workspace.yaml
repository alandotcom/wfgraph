# pnpm reads every setting from this file. Only auth and registry settings come
# from .npmrc, and the "pnpm" field in package.json is not consulted at all, so
# workspace globs, the catalog, dependency overrides and build-script approval
# all live here.

packages:
  - "packages/*"
  - "examples"

# One version per shared dependency, referenced from a package's own manifest as
# `"effect": "catalog:"`. pnpm rewrites those specifiers to the real range during
# `pnpm pack` and `pnpm publish`, the same way it rewrites `workspace:*`, so a
# published package carries ordinary semver.
# The @orpc packages are pinned to one exact 2.x beta and all listed here,
# including the ones only a single workspace package imports. They cross-depend on
# each other at exact versions, so a mismatched pair does not resolve; keeping the
# version in one place is what makes "they move together" a fact rather than a rule
# someone has to remember. A beta line also moves under you, hence the exact pin.
# `effect` and the four `@effect/*` packages are here for the same reason: an
# @effect/* package names one exact core release as a peer, so the whole set moves
# as one (ADR-0002).
catalog:
  # The build agent's model provider. The AI runtime itself is inside `effect`,
  # at `effect/ai`; this package is the OpenAI half alone.
  "@effect/ai-openai": 4.0.4
  "@effect/opentelemetry": 4.0.4
  "@effect/sql-sqlite-node": 4.0.4
  "@effect/vitest": 4.0.4
  # The backend and the editor both log through logtape.
  "@logtape/logtape": ^2.4.0
  "@marcbachmann/cel-js": ^8.0.0
  "@orpc/client": 2.0.0-beta.43
  "@orpc/contract": 2.0.0-beta.43
  "@orpc/experimental-effect": 2.0.0-beta.43
  "@orpc/openapi": 2.0.0-beta.43
  "@orpc/server": 2.0.0-beta.43
  "@orpc/tanstack-query": 2.0.0-beta.43
  "@standard-schema/spec": ^1.1.0
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@xyflow/react": ^12.12.0
  # The second foreign Standard Schema library the schema tests are written
  # against, beside zod below.
  arktype: ^2.2.8
  effect: 4.0.4
  es-toolkit: ^1.52.0
  graphology: ^0.26.0
  # The router @wfgraph/core builds its own app on, declared there as a peer
  # dependency for the same reason inngest is, and named here for the same
  # reason: the peer range and the version the workspace resolves have to agree.
  # @hono/node-server names `hono: ^4` as its own peer, so it binds to whichever
  # copy this range resolves.
  hono: ^4.13.13
  # @wfgraph/core declares this as a peer dependency, so the host installs the
  # SDK and picks the version inside this range. The example app installs it the
  # way an adopter does, which means the peer range and the version the workspace
  # actually resolves have to agree; writing it once here is what makes that so.
  # pnpm rewrites `catalog:` inside peerDependencies at pack and publish time,
  # the same as it does in the other three dependency blocks.
  inngest: ^4.23.0
  postgres: ^3.4.9
  react: 19.3.0
  react-dom: 19.3.0
  tsx: ^4.23.15
  # The RFC 9562 generator behind `generateId` in @wfgraph/shared. Its `v7()` is
  # the only export the repository calls.
  uuid: ^14.0.3
  vite: ^8.3.4
  vitest-evals: ^0.17.0
  # The example app writes its Events and its custom action in it, and the schema
  # tests in packages/core and packages/shared use it as the foreign Standard
  # Schema library, beside arktype.
  zod: ^4.6.5

# Pins one React copy through the whole graph, including transitive peers. The
# catalog protocol is how pnpm keeps an override and the catalog entry from
# drifting apart, so the version is written once, above.
overrides:
  react: "catalog:"
  react-dom: "catalog:"
  # inngest-cli pins adm-zip to ^0.5.10, which never reaches the patched line;
  # GHSA-xcpc-8h2w-3j85 (crafted ZIP triggers a 4GB allocation) and
  # GHSA-vwc7-r8mq-g2x9 (destination symlink overwrite) are fixed in 0.6.1.
  adm-zip: "0.6.1"
  # cosmiconfig accepts the vulnerable js-yaml 4.3.1. GHSA-2883-xcg3-v3hh
  # (empty merge sources bypass the merge-key CPU limit) is fixed in 4.3.2.
  "js-yaml@^4": "4.3.2"
  # GHSA-67mh-4wv8-2f99 (dev server answers any origin's request) is fixed at
  # 0.24.3; pin the tree onto a current 0.28 line that drizzle-kit, tsx and vite
  # already resolve within.
  esbuild: "^0.28.2"
  # fastify's JSON Schema stack resolves both fast-uri majors. Four advisories
  # reach past the 3.1.5 / 4.1.2 this used to pin, all in how a URI's host is
  # normalized: GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf (request forgery
  # through malformed IPv6 and through repeated percent-decoding),
  # GHSA-jqff-g426-hqxp and GHSA-5jgf-p345-68v8 (host confusion through a
  # percent-encoded scheme and a skipped IDN canonicalization). Fixed in
  # 3.1.6 / 4.1.3, and these are the current releases of both lines.
  "fast-uri@^3": "3.1.7"
  "fast-uri@^4": "4.1.4"
  # eslint's minimatch pulls brace-expansion 5.x; GHSA-rgw5-rvv9-x895 (DoS via
  # unbounded intermediate arrays) is fixed in 5.0.9.
  "brace-expansion@^5": "5.0.9"
  # postcss pins nanoid to the 3.x line; GHSA-2v37-7h3g-55p8 (custom generators
  # loop when size is zero) is fixed in 3.3.17.
  "nanoid@^3": "3.3.18"
  # qs arrives under express, through body-parser. GHSA-4mjr-xmp4-gh2g (denial
  # of service through an attacker-controlled isBuffer) and GHSA-x5fp-wj9c-mxmx
  # (array-limit bypass through comma parsing of a bracket key) are both fixed
  # in 6.16.0.
  qs: "6.16.0"

# pnpm refuses to run a dependency's install scripts until the dependency is
# named here, so a package that gains a postinstall arrives as a warning rather
# than as executed code. Every package with an install script has to appear,
# true or false, or the install ends with ERR_PNPM_IGNORED_BUILDS.
#
# inngest-cli downloads its platform binary and protobufjs generates its typed
# accessors, so both need their scripts.
#
# esbuild ships its platform binaries as optional dependencies, so its script
# only re-checks work the resolver already did.
#
# @clerk/shared's postinstall prints a telemetry notice and writes a marker file
# into the developer's own config directory. Nothing the package needs in order
# to work, so it stays off.
#
# msgpackr-extract arrives under effect, through msgpackr. It compiles a native
# accelerator for the same encoding msgpackr already does in JavaScript, and
# msgpackr uses the JavaScript path when the addon is absent, so it stays off.
allowBuilds:
  "@clerk/shared": false
  esbuild: false
  inngest-cli: true
  msgpackr-extract: false
  protobufjs: true

# Version-specific exceptions to pnpm 11's 1440-minute minimumReleaseAge default.
# Security fixes and explicitly approved fresh releases can be installed normally.
minimumReleaseAgeExclude:
  - "effect@4.0.4"
  - "@effect/ai-openai@4.0.4"
  - "@effect/opentelemetry@4.0.4"
  - "@effect/sql-sqlite-node@4.0.4"
  - "@effect/vitest@4.0.4"
  - brace-expansion@2.1.3 || 5.0.9
  - fast-uri@3.1.5 || 4.1.2
  - nanoid@3.3.18
  - js-yaml@4.3.2
  - "@orpc/client@2.0.0-beta.43"
  - "@orpc/contract@2.0.0-beta.43"
  - "@orpc/experimental-effect@2.0.0-beta.43"
  - "@orpc/json-schema@2.0.0-beta.43"
  - "@orpc/openapi@2.0.0-beta.43"
  - "@orpc/server@2.0.0-beta.43"
  - "@orpc/shared@2.0.0-beta.43"
  - "@orpc/tanstack-query@2.0.0-beta.43"
  - "@tanstack/react-virtual@3.14.14"
  - "@tanstack/virtual-core@3.18.0"
  - inngest-cli@1.45.1
  - "@assistant-ui/core@0.3.25"
  - "@assistant-ui/react-markdown@0.14.20"
  - "@assistant-ui/react@0.15.26"
  - "@assistant-ui/store@0.3.18"
  - "@assistant-ui/tap@0.9.22"
  - "@base-ui/react@1.9.0"
  - "@base-ui/utils@0.5.0"
  - "@clerk/backend@3.23.2"
  - "@clerk/shared@4.40.0"
  - "@types/node@24.19.2"
  - "assistant-cloud@0.2.6"
  - "assistant-stream@0.3.49"
  - "dotenv@18.0.7"
  - "express@5.3.0"
  - "framer-motion@14.1.0"
  - "inngest@4.23.0"
  - "knip@6.41.0"
  - "lucide-react@1.54.0"
  - "motion-dom@14.1.0"
  - "motion-utils@14.1.0"
  - "motion@14.1.0"
  - "smol-toml@1.9.1"
  - "uuid@14.0.3"

patchedDependencies:
  # RC4 calls Effect's removed Schema.TaggedErrorClass API. Upstream replaced it
  # with Schema.TaggedError in drizzle-team/drizzle-orm@b1b6cf1 on the unreleased
  # rc5 branch; remove this patch after upgrading to a release containing it.
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
