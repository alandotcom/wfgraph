name: PR Checks

on:
  pull_request:
    branches: ["*"]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` is a formatting check only now that oxfmt has replaced
      # ultracite. Linting needs its own step, because the tool it used to
      # ride along with (Biome, through ultracite) is gone.
      - name: Run format check
        run: bun run check

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Run build
        run: bun run build
