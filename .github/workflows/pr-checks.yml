name: PR Checks

on:
  pull_request:
    branches: ["*"]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The pnpm version comes from the "packageManager" field in the root
      # package.json, so this action pins none of its own. `cache` keys the
      # pnpm store on pnpm-lock.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check` is a formatting check only now that oxfmt has replaced
      # ultracite. Linting needs its own step, because the tool it used to
      # ride along with (Biome, through ultracite) is gone.
      - name: Run format check
        run: pnpm run check

      - name: Run lint
        run: pnpm run lint

      # `@rova/client` publishes through package exports to dist/, and
      # examples/app.ts imports that entry. The root tsconfig maps shared/core/
      # plugins to source, but client is not on that list, so typecheck needs
      # the built declarations (AGENTS.md).
      - name: Build client package
        run: pnpm --filter @rova/client build

      - name: Run type check
        run: pnpm run typecheck

      # knip reads the same source tsc does and reports what nothing reaches:
      # unused files, exports and dependencies, plus imports of packages that no
      # manifest declares. See knip.ts for why each entrypoint and each ignore
      # is there.
      - name: Run knip
        run: pnpm run knip

      # The suite is self-contained: it was run with the local .env moved aside to
      # confirm all 662 tests pass with no environment file, database or other
      # service, which is what this runner gives it. vitest.config.ts puts the
      # client project in a happy-dom environment, so the client-side tests get
      # their DOM here too.
      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build
