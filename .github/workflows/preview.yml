name: Preview

# Continuous releases for work in progress. Every push to an open pull request
# publishes the three published packages to pkg.pr.new, which hosts
# npm-compatible tarballs on its own infrastructure and comments the install
# URLs on the PR. Nothing here reaches npmjs.com, so this file holds no
# credential and is unrelated to release.yml's trusted publisher.
#
# workflow_dispatch covers a branch with no pull request yet: the packages are
# still published and the URLs are printed in the job log.
on:
  pull_request:
  workflow_dispatch:

# The pkg-pr-new GitHub App posts the comment and the check run, so the
# workflow token needs nothing.
permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The published entries point at dist, so the tarballs are empty without
      # this.
      - name: Build
        run: pnpm run build

      # One invocation for all three packages: pkg.pr.new's anti-spam rule is
      # that the command runs once per workflow. @wfgraph/agent and
      # @wfgraph/shared are absent because they are private and tsdown inlines
      # them into the three that ship.
      #
      # Three flags carry the weight:
      #
      # --pnpm packs with `pnpm pack`. Required, because this workspace writes
      #   `catalog:` ranges that `npm pack` cannot resolve.
      # --previewVersion rewrites each version to 0.0.0-preview-<sha> before
      #   packing, which keeps a preview off the real semver line. Without it a
      #   preview tarball packs as 3.1.1 and a lockfile can go on resolving the
      #   published 3.1.1 to it.
      # --commentWithSha prints the commit-sha install URL instead of the pull
      #   request one. The paragraph below has the reasoning.
      #
      # --peerDeps is deliberately absent, though it reads like the flag this
      # repo wants: it carries the preview version into cross-package
      # peerDependencies, and @wfgraph/plugins does name @wfgraph/core as a
      # peer. What it actually produces is a requirement nothing can satisfy.
      # pkg.pr.new rewrites ordinary dependencies to pkg.pr.new URLs, while
      # --peerDeps writes a bare version string, and a semver requirement never
      # matches a URL-resolved package. A consumer installing core from a
      # preview URL gets `No version matching "0.0.0-preview-<sha>" found for
      # peer dependency "@wfgraph/core" (but package exists)` under bun, even
      # though the installed core's version is that exact string. Left at `*`
      # the peer resolves quietly under bun and under pnpm. The rule that
      # motivates the flag, a bare range refusing a prerelease, applies to a
      # version resolution and does not fire on a URL one.
      #
      # Every publish registers three refs for the same tarball: the commit
      # sha, the pull request number, and the branch name. Only the sha ref is
      # safe to hand a consumer. The pull request ref reads as stable text that
      # follows the newest build, but a lockfile stores the URL verbatim next
      # to the integrity hash of whatever it fetched, and the URL string is the
      # resolution key. So `@172` stops moving the moment it lands in a
      # lockfile. Against a warm cache the old tarball reinstalls with no
      # warning; against a cold one (a fresh clone, or CI) the newer tarball
      # arrives, fails the recorded hash, and the install dies with
      # IntegrityCheckFailed. Neither `bun update` nor `bun install --force`
      # re-resolves it, since both are defined over semver ranges and a URL has
      # none, so a bump means deleting the lockfile entry by hand. A sha URL is
      # immutable, which keeps the hash valid and makes the bump a visible
      # diff.
      #
      # Run from the lockfile with `pnpm exec`. pkg.pr.new asks CI to avoid
      # `pnpm dlx` here.
      - name: Publish preview packages
        run: >
          pnpm exec pkg-pr-new publish --pnpm --previewVersion --commentWithSha
          --packageManager=pnpm
          ./packages/core ./packages/client ./packages/plugins
