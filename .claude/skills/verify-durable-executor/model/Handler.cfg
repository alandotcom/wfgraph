\* The handler model: one node whose handler reads from one vendor and sends
\* the value to another, two workers, a retry limit of 2.
CONSTANTS
  Workers = {1, 2}
  MaxAttempts = 2
  MaxFaults = 1
SPECIFICATION Spec
CONSTRAINT CountersBounded
INVARIANT WriteAppliedOnce
INVARIANT AppliedWriteMatchesTheOutput
INVARIANT RefusalFailsTheNodeOnce
INVARIANT FailedOnlyOnRefusalOrSpentRetries
PROPERTY NodeEnds
\* REACH ReachSentTwice
\* REACH ReachRefused
\* REACH ReachRetriedThenOk
\* REACH ReachStaleRead
