\* The arrivals model: two arrivals of Event X delivered at once to one
\* workflow, every combination of Wait match, a Migration that re-parks one
\* Wait with a new match and token, two workers.
CONSTANTS
  Workers = {1, 2}
  MaxFaults = 1
SPECIFICATION Spec
