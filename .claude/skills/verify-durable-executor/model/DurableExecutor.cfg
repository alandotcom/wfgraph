\* The run model: one Execution, two Started-side Waits, a Join, a Canceled-side
\* Wait and its Outlet, two workers. check.sh checks each INVARIANT under Spec,
\* each PROPERTY under FairSpec, and requires each REACH predicate to be reachable.
CONSTANTS
  Workers = {1, 2}
  MaxAttempts = 2
  MaxFaults = 1
SPECIFICATION Spec
CONSTRAINT CountersBounded
INVARIANT WokenBranchIsNeverStranded
INVARIANT SleepingRunHasADeadline
INVARIANT EachWaitWokenOnce
INVARIANT EachBranchRunsOnce
INVARIANT JoinRunsOnceAfterBothBranches
INVARIANT CanceledOutletEnteredOnceOnCancel
INVARIANT OneClaimWins
INVARIANT NoStartedWorkAfterAClaim
INVARIANT NoCanceledWorkAfterExit
INVARIANT NothingCommitsAfterTheRunEnds
INVARIANT OneTerminalRecord
INVARIANT NoWaitLeftOpenAfterTheRunEnds
INVARIANT ExitHaltsEveryWait
INVARIANT EndMatchesWork
INVARIANT CancelClaimRunsItsOutlet
INVARIANT FailedOnlyAfterRetriesSpent
INVARIANT LeaseHasAHolder
PROPERTY EveryRunEnds
PROPERTY EveryWakeIsActedOn
\* REACH ReachCompleted
\* REACH ReachCanceledByEvent
\* REACH ReachExitedAtBranch
\* REACH ReachExitedAtJoin
\* REACH ReachFailed
\* REACH ReachRetriedJoin
\* REACH ReachCanceledAfterJoinFailed
\* REACH ReachCanceledWaitParks
\* REACH ReachTimeoutWake
\* REACH ReachStaleWorkerFenced
