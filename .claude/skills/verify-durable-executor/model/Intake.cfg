\* The intake model: one workflow and one Entity, two Start arrivals and a
\* Cancel arrival, each possibly sent twice, both Concurrency modes, two workers.
CONSTANTS
  Workers = {1, 2}
  MaxFaults = 1
SPECIFICATION Spec
INVARIANT DuplicateSendIsOneArrival
INVARIANT EachArrivalOpensAtMostOneRun
INVARIANT OneLiveRunPerEntity
INVARIANT EveryOpenRunIsScheduled
INVARIANT SupersededRunsStop
PROPERTY EveryArrivalIsDelivered
PROPERTY EveryRunEnds
\* REACH ReachSupersede
\* REACH ReachRefusedStart
\* REACH ReachCanceledRun
\* REACH ReachRedelivery
\* REACH ReachHostTransactionDelivered
