\* The cron model: one workflow with two schedules, each written in one of two
\* expressions, a clock of three units, one Publish, a pause and a resume,
\* both Concurrency modes, two workers.
CONSTANTS
  Workers = {1, 2}
  MaxTime = 3
  MaxFaults = 1
  MaxPublishes = 1
  MaxToggles = 2
SPECIFICATION Spec
CONSTRAINT CountersBounded
INVARIANT OneFirePerSlot
INVARIANT NoFireWithoutTheLease
INVARIANT NoFireWhilePaused
INVARIANT NoFireForAnUnpublishedSchedule
INVARIANT TimersMatchThePublishedSchedules
INVARIANT FireRunsTheLatestSlot
INVARIANT NoFireBeforeTheTimerStarted
INVARIANT FireRunsThePublishedVersion
INVARIANT OneLiveScheduledRun
PROPERTY EveryDueTimerFires
\* REACH ReachMissedSlotsFireOnce
\* REACH ReachRefusedStart
\* REACH ReachSupersede
\* REACH ReachKeptTimerFiresOnTheNewVersion
\* REACH ReachEditedTimerFires
\* REACH ReachAddedTimerFires
\* REACH ReachResumedTimerFires
\* REACH ReachFencedByPause
\* REACH ReachFencedByEdit
