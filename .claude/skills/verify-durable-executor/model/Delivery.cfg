\* The delivery model: one arrival of Event X delivered to two workflows, W1
\* starting on X and W2 cancelling on X, with Waits on X in both, two workers.
CONSTANTS
  Workers = {1, 2}
  MaxFaults = 1
SPECIFICATION Spec
CONSTRAINT CountersBounded
INVARIANT NoWakeInTheRunItStarted
INVARIANT NoWakeInARunItSettled
INVARIANT NoSecondWaitFromOneArrival
INVARIANT EachWaitWokenOnce
INVARIANT LateParkCatchesUp
PROPERTY SurvivingWaitsAreWoken
\* REACH ReachR2WokenThenParkedAgain
\* REACH ReachNewRunParksBeforeScan
\* REACH ReachCanceledWaitParked
\* REACH ReachRedeliveredAfterCrash
\* REACH ReachPageOfferedTwice
\* REACH ReachReopenedAfterR2ParkedAgain
\* REACH ReachLateParkCaughtUp
