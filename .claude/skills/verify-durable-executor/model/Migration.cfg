\* The Migration model: one run with a node above a Wait and a node below it,
\* two published versions whose Waits may differ in mode, up to two
\* Migrations, two workers.
CONSTANTS
  Workers = {1, 2}
  MaxAttempts = 2
  MaxFaults = 1
  MaxMigrations = 2
SPECIFICATION Spec
CONSTRAINT CountersBounded
INVARIANT AboveRunsOnce
INVARIANT BelowRunsOnce
INVARIANT BelowRunsThePinnedVersion
INVARIANT EachHopWokenOnce
INVARIANT ParkedUnderThePinnedVersion
INVARIANT WokenWaitIsNeverStranded
INVARIANT NoEventLostToAMigrateWake
INVARIANT EventOnlyWakesAnEventPark
INVARIANT ParkedInThePinnedMode
INVARIANT OneTerminalRecord
INVARIANT FailedOnlyAfterRetriesSpent
INVARIANT LeaseHasAHolder
PROPERTY EveryRunEnds
\* REACH ReachMigratedAndCompleted
\* REACH ReachReparkedOnNewVersion
\* REACH ReachFenceRefusedResume
\* REACH ReachMigratedBackAndForth
\* REACH ReachEventBeatsMigrateWake
\* REACH ReachReparkedInTheOtherMode
\* REACH ReachEventReplacesMigrateWake
\* REACH ReachEventResumesAcrossAModeChange
